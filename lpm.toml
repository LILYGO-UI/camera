schema_version = 1

[project]
package = "lilygo-ui-camera"
version = "0.1.0"
app_id = "cc.lilygo.ui.Camera"
title = "Camera"
summary = "Photo and video app for T-DisplayCM0"
description = "Camera app powered by IMX219 and the libcamera C++ API, with a live viewfinder, JPEG photos, configurable 1080p/720p silent video recording, and recent capture previews."
license = "MIT"
source_repo = "https://github.com/LILYGO-UI/camera"
homepage = "https://github.com/LILYGO-UI/camera"
categories = ["Multimedia"]

[[project.authors]]
name = "lbuque"
email = "110239031@qq.com"

[project.assets]
icon = "assets/app-icon.png"

[[project.assets.screenshots]]
path = "assets/previews/preview1.png"
caption = "Camera viewfinder"

[[project.assets.screenshots]]
path = "assets/previews/camera-landscape.png"
caption = "Landscape camera interface"

[[project.permissions]]
id = "camera"
reason = "Use the IMX219 camera for the viewfinder, photos, and video recording"

[[project.permissions]]
id = "filesystem"
access = "read-write"
scope = "shared-data"
reason = "Save photos and videos to the user's $HOME/Camera folder or a specified capture folder"

[project.compatibility]
architectures = ["arm64"]
min_appkit_version = "0.1.0"

[project.launcher]
order = 90

[build]
host_preset = "host-simulator"
cross_preset = "cm0-cross"
package_dir = "dist"

[deploy]
host = "raspberrypi.local"
user = "pi"
port = 22
